[package]
name = "fdk-aac-prebuilt-sys"
version.workspace = true
edition = "2021"
# 2021, not 2024, and no MSRV-raising syntax: this crate's whole job is to be linkable from
# other people's projects, so it should not be the thing that forces a toolchain upgrade on
# any of them.
rust-version = "1.70"
description = "Raw FFI for the Fraunhofer FDK AAC codec, linked from a prebuilt static archive — no C++ toolchain"
# Not an SPDX licence, and not an oversight. The FDK AAC Codec Library licence is a
# Fraunhofer source licence with a patent notice that grants no patent rights; it is not
# OSI-approved and has no SPDX identifier, so the text itself is what ships. See LICENSE at
# the repository root and the README's licensing section.
license-file = "../../LICENSE"
repository = "https://github.com/andrewtheguy/fdk-aac-prebuilt"
# Declared so that two crates linking fdk-aac into one binary is a cargo error rather than a
# duplicate-symbol link error, and so consumers can read DEP_FDK_AAC_INCLUDE. Upstream
# `fdk-aac-sys` has no `links` key, which is why it can be vendored twice into one tree and
# only discovered at link time.
links = "fdk-aac"
build = "build.rs"
# git-only, deliberately: the archives are what makes this crate work and they are large
# binary files. The licence would also need arguing with crates.io. Nothing here is fit for
# publication.
publish = false

[features]
# Link the x86-64-v3 flavour of the archive instead of the baseline one, on x86_64 targets
# only. fdk-aac has no runtime CPU dispatch, so this is the only way to get its scalar loops
# autovectorized with AVX2 — and the only way to get a binary that dies with an illegal
# instruction on a CPU without it. Off by default for that reason; the README has the
# measured difference, which is small. Ignored, with a `cargo:info` line, on other targets.
x86-64-v3 = []

[dependencies]
