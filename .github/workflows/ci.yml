name: CI

# On every push and pull request, unlike build.yml, which is manual.
#
# The distinction is what changes commit to commit. The *archives* change only when
# fdk-aac.env or build.sh does — a deliberate act, followed by a deliberate `build.yml` run
# — so rebuilding six of them on every push would be six runners proving that a pinned
# tarball is still pinned. The *Rust crates, the generated files and the shell scripts*
# change constantly, and nothing would check them unless somebody remembered to press a
# button.
#
# So: the x86_64 Linux pair rather than all six targets, plus the checks that need no compiler.
#
# Every job builds the archive it links. None downloads one: the published archives are in a
# private repository (fdk-aac.env), which a public repository's workflow has no login for, so
# build.rs's third resolution step is exercised by whoever runs `publish-private.sh` and then
# builds a consumer, not here.
on:
  push:
    # Documentation cannot break a build, and a README-only commit should not spend a runner
    # proving it.
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        # `-x` so that `. ./fdk-aac.env` and `. ./source.sh` are followed rather than
        # reported as unresolvable.
        run: |
          shellcheck -x build.sh sync-prebuilt.sh publish-private.sh test-docker.sh check-static.sh check-reproducible.sh ci/unix/ci.sh ci/unix/remote.sh \
                        crates/fdk-aac-prebuilt-sys/gen-bindings.sh \
                        crates/fdk-aac-prebuilt-sys/gen-version.sh
      # The comparison script decides whether a release happens, so a syntax error in it must
      # not wait until six archives have been built to surface.
      - name: compare-targets.py parses
        run: python3 -m py_compile compare-targets.py

  # A separate job on macOS for one reason: its `/bin/bash` is 3.2, from 2007, and that is
  # what a stock Mac runs. shellcheck accepts bash-5-only constructs happily, and
  # `$(case … esac)` — legal in bash 4+, a syntax error in 3.2 — is the kind of thing that
  # breaks on the macOS runner while passing on every other target and on a Mac with
  # Homebrew's bash earlier in PATH. Parsing is enough to catch that class of bug, and it
  # costs seconds.
  stock-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every script with the bash a stock Mac ships
        run: |
          /bin/bash --version | head -1
          /bin/bash -n build.sh source.sh sync-prebuilt.sh publish-private.sh test-docker.sh check-static.sh check-reproducible.sh ci/unix/ci.sh ci/unix/remote.sh \
                       crates/fdk-aac-prebuilt-sys/gen-bindings.sh \
                       crates/fdk-aac-prebuilt-sys/gen-version.sh
          echo "every script parses under bash $(/bin/bash -c 'echo $BASH_VERSION')"

  # The generated files, against the source they were generated from.
  #
  # Three links in one chain: fdk-aac.env pins a checksum, the checksum gates the tarball,
  # the tarball is where the headers come from, and the headers are where bindings.rs comes
  # from — with version.rs coming from the .cpp sources beside them. It holds only if every
  # link is checked, and `--check` is the only thing that checks them.
  #
  # Separate from `scripts` because it needs libclang and a bindgen install, which is a
  # minute this repository should not spend on a shellcheck-only change.
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned bindgen
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          cargo install bindgen-cli --version 0.72.1 --locked
      - run: ./sync-prebuilt.sh --check

  # fmt and clippy. Not present in libopus-prebuilt, and added here because this fork's
  # wrapper is *changed* from upstream rather than copied verbatim — so its style is this
  # repository's responsibility rather than somebody else's, and there is no "matching
  # upstream" defence for a lint.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # fmt first and on its own: it needs nothing built, so a formatting failure reports in
      # seconds rather than after a C++ compile.
      - run: cargo fmt --all --check
      # clippy has to run the build script, which has to resolve an archive. Built here
      # rather than fetched: the published ones are private, and this job has no login.
      - run: ./build.sh linux-x86_64 && ./sync-prebuilt.sh
      - run: cargo clippy --offline --workspace --all-targets -- -D warnings

  # The real gate: build an archive, link the crates against it, run the tests and the
  # end-to-end binary. x86_64 rather than arm64 because it is the target where a wrong
  # answer is an illegal instruction on somebody's machine — a floor that leaked into an
  # archive with no runtime dispatch — where on arm64 it would only be a slower library. It
  # is build.sh's disassembly check, run here, that catches that; the runner's own CPU has
  # AVX2 and would execute a leaked floor without complaint. The group holds both x86_64
  # flavours, so build.yml's compare job runs too and asserts their bitstreams are identical.
  #
  # Calling build.yml rather than repeating it means CI and the manual test loop exercise
  # the same code, with no CI-only build to drift.
  #
  # build.yml's `compare` job takes an expected count from `plan` rather than guarding on
  # "at least two digest files", because the earlier guard could not tell a deliberately
  # narrowed matrix from a matrix whose other targets had died, and failed both. With the
  # x86_64 group at two targets the job runs here as well; the full cross-architecture
  # comparison still happens only on a manual `build.yml` run.
  archives:
    uses: ./.github/workflows/build.yml
    with:
      targets: x86_64

  # No reproducibility job here. It compared this run's linux-x86_64 archive with a second
  # runner's, which needed the archive uploaded as an artifact — and a public repository's
  # artifacts can be downloaded by anyone with a GitHub account, which is publishing the binary
  # this repository does not publish. check-reproducible.sh makes the same comparison locally
  # (a fresh container, another path, later), and publish-private.sh runs it on every release.

  # Leak checking on the one platform that has `leaks` — macOS. The other two legs live
  # elsewhere: valgrind runs under `test-docker.sh` on Linux, and the e2e binary's own RSS
  # churn check runs on every target, Windows included.
  #
  # `leaks` rather than a Rust allocator hook, because fdk-aac allocates with C `malloc`
  # through libSYS. A `GlobalAlloc` counter sees only Rust-side allocation and would report
  # a clean run however badly the handles leaked — which is why the control below is not
  # optional.
  leaks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the archive, then the e2e binary against it
        run: |
          ./build.sh macos-arm64 && ./sync-prebuilt.sh
          cargo build --offline --release -p fdk-aac-e2e

      - name: No leaks
        env:
          # Required, not tidiness. The binary's own RSS check creates and destroys 1200
          # codecs, and `leaks` inspects the process at exit — the churn makes its report
          # noisy for no benefit, and the tool below is the better instrument anyway.
          FDK_AAC_E2E_MEMORY: "off"
        run: |
          # --atExit runs the process to completion and inspects it just before it dies,
          # which is the only moment a leak is distinguishable from memory still in use.
          MallocStackLogging=1 leaks --atExit -- ./target/release/fdk-aac-e2e >leaks.log 2>&1 \
            || { grep -E 'leaks for|Leak:' leaks.log | head -20; exit 1; }
          grep -E 'leaks for' leaks.log

      - name: And the control — a deliberate leak must be caught
        env:
          FDK_AAC_E2E_MEMORY: "off"
        run: |
          # If this passes, the check above proves nothing: it would mean `leaks` cannot see
          # fdk-aac's allocations, and a clean report is a blind one.
          if MallocStackLogging=1 leaks --atExit -- \
               ./target/release/fdk-aac-e2e --leak-only >control.log 2>&1; then
            echo "::error::leaks did not notice 120 deliberately forgotten fdk-aac handles"
            exit 1
          fi
          grep -E 'leaks for' control.log
