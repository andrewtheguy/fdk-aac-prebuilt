name: Release fdk-aac archives

# Manual, and separate from build.yml on purpose: "does this build and pass" is a question
# worth asking at any time, and it should not require being committed to a release to ask it.
# This workflow answers the other question, and it answers it by *calling* build.yml rather
# than repeating it — so the archives that get published are the ones that passed the same
# tests, run by the same code, and a failure anywhere in there means no release.
#
# Draft first, publish last. The property that buys: **a draft release does not create the
# git tag.** Everything — four builds, their tests, the e2e binaries, the cross-target digest
# comparison, packaging, upload — happens while the tag still does not exist, and the tag
# appears only when the draft is published at the very end. A cancelled or failed release
# leaves a deletable draft rather than a tag pointing at archives nobody should link.
#
# The tag is *computed*, never typed: `v<fdk-aac>-<YYYYMMDDHHMMSS>-<short sha>`. The version
# says what is inside, the timestamp says when, and the hash says which commit — and because
# this job derives all three from the tree it is building, none of them can disagree with it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      stamp: ${{ steps.tag.outputs.stamp }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine the tag
        id: tag
        run: |
          . ./fdk-aac.env
          # fdk-aac.env is hand-edited, and every asset filename is built from this value, so
          # a typo here becomes a release full of misnamed archives that no consumer's
          # build.rs can find.
          echo "$FDK_AAC_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || {
            echo "::error::FDK_AAC_VERSION in fdk-aac.env is not a version: '$FDK_AAC_VERSION'"
            exit 1
          }
          # `$GITHUB_SHA` rather than `git rev-parse --short HEAD`: it is the commit this run
          # is building, by definition, and it needs neither a .git directory nor a checkout
          # deep enough to have one.
          [ ${#GITHUB_SHA} -eq 40 ] || {
            echo "::error::GITHUB_SHA is not a full sha: '$GITHUB_SHA'"
            exit 1
          }
          # The build stamp, and the tag built from it — in that order, and both exported,
          # because the release title wants the stamp on its own and deriving it back out of
          # the finished tag is how a title ends up with its version in it twice.
          #
          # Seconds, not just the date: two releases on one day would otherwise sort by
          # nothing useful, the only thing distinguishing them being a commit hash with no
          # order to it. A full timestamp sorts lexicographically, which is the order they
          # happened. UTC, so it does not depend on the timezone of whoever pressed the
          # button.
          stamp="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          tag="v${FDK_AAC_VERSION}-${stamp}"
          # Never `latest` off a branch: a release built from anything but the default branch
          # is a prerelease.
          is_prerelease=false
          [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] || is_prerelease=true

          echo "releasing $tag from $GITHUB_REF_NAME (prerelease=$is_prerelease)"
          echo "version=${FDK_AAC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      # Vestigial now that the stamp carries seconds — two runs of this workflow cannot
      # collide unless they start in the same second on the same commit. Kept because it
      # costs one request and the thing it guards against is a tag silently moving.
      - name: Abort if the tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.tag.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.tag.outputs.tag }} already exists."
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A leftover draft from a failed run is the only thing that can collide, since a
          # draft never created a tag for the check above to have found.
          if gh release view "${{ steps.tag.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft ${{ steps.tag.outputs.tag }}"
            gh release delete "${{ steps.tag.outputs.tag }}" --yes
          fi
          gh release create "${{ steps.tag.outputs.tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "fdk-aac ${{ steps.tag.outputs.version }} static archives - ${{ steps.tag.outputs.stamp }}" \
            --generate-notes \
            ${{ steps.tag.outputs.is_prerelease == 'true' && '--prerelease' || '' }}

  # Every target, built and tested by the same workflow the manual test loop uses. Not a copy
  # of it — the same file. Its `compare` job is part of this gate: four archives that do not
  # agree on the audio they produce do not get published.
  archives:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      targets: all

  publish:
    needs: [prepare, archives]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `merge-multiple`: each target's artifact is a *tree* (lib/, include/, MANIFEST)
      # and they must stay in separate directories to be packaged separately.
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: fdk-aac-*
          path: artifacts

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          # Named here rather than discovered, so that a target silently missing from the
          # matrix is a failed release instead of a release somebody links against six months
          # later and finds nothing for their platform.
          expected="macos-arm64 linux-x86_64 linux-x86_64-v3 linux-aarch64 windows-x86_64-msvc windows-x86_64-msvc-v3"
          for target in $expected; do
            dir="artifacts/fdk-aac-$target"
            [ -f "$dir/MANIFEST" ] || {
              echo "::error::no archive for $target — refusing to publish an incomplete release"
              exit 1
            }
            tar czf "dist/fdk-aac-${VERSION}-${target}.tar.gz" -C "$dir" .
          done

          # SHA256SUMS, generated here and published as an asset — never committed. GitHub
          # does record a sha256 digest per asset, but only through `api.github.com`, which is
          # a second request, rate-limited to 60/hour for anyone unauthenticated, and JSON
          # that a zero-dependency build.rs would have to parse. An asset beside the archives
          # is one more plain GET from the URL it is already using.
          #
          # It is a corruption check, not a tamper check: it lives on the same release as the
          # files it covers, so it proves the download arrived intact, not that the release is
          # honest. The checksum that constrains a party other than us is the one in
          # fdk-aac.env, enforced against Fraunhofer's tarball before a compiler runs.
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -l dist

      - name: Upload the assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            dist/SHA256SUMS dist/*.tar.gz --clobber

      - name: Add the consumer notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Appended to the generated commit list rather than replacing it: the commits say
          # what changed, and this says what to do about it. Anyone arriving at this release
          # wants the second thing and will not find it in a diff.
          gh release view "$TAG" --json body --jq '.body' > notes.md
          cat >> notes.md <<EOF

          ---

          ## Using these from Rust

          \`\`\`toml
          fdk-aac = { package = "fdk-aac-prebuilt", git = "https://github.com/${GITHUB_REPOSITORY}", tag = "${TAG}" }
          \`\`\`

          \`[lib] name = "fdk_aac"\`, so every \`use fdk_aac::enc::…\` keeps compiling. Nothing
          needs pinning beyond the tag: \`build.rs\` fetches the archive for its target from
          this repository's latest release, so a consuming project picks up a new archive by
          updating its git dependency and nothing else.

          Note one source change from upstream \`fdk-aac\` 0.8.0: **\`Encoder::encode\` takes
          \`&mut self\`**, so a \`let encoder = …\` becomes \`let mut encoder = …\`. That is
          deliberate — \`aacEncEncode\` mutates encoder state, and upstream's \`&self\` plus
          \`unsafe impl Sync\` made a data race reachable from safe code. See the crate docs
          for the rest of what this fork fixed, HE-AAC among it.

          ## No C++ runtime

          \`build.sh\` inspects each archive's undefined symbols and records the answer in its
          MANIFEST; on every target it is \`cxx_runtime none\`. So \`build.rs\` emits no
          \`-lstdc++\` or \`-lc++\`, and a binary linking this has no C++ runtime dependency
          at all — unlike \`fdk-aac-sys\`, which emits one unconditionally.

          ## CPU floors

          Two archives per x86_64 platform. The default, \`linux-x86_64\` and
          \`windows-x86_64-msvc\`, has **no floor above the x86-64 baseline** and runs on any
          x86-64; \`build.sh\` asserts the Linux one contains no AVX instruction at all. The
          \`-v3\` twins are the same source built to **x86-64-v3 (AVX2, Coffee Lake or
          newer)**, which fdk-aac — having no runtime CPU dispatch of its own — can only use if
          the whole archive assumes it. Enable the crate's \`x86-64-v3\` feature to link
          those instead:

          \`\`\`toml
          fdk-aac = { package = "fdk-aac-prebuilt", git = "https://github.com/${GITHUB_REPOSITORY}", tag = "${TAG}", features = ["x86-64-v3"] }
          \`\`\`

          What it buys is autovectorisation of the scalar loops with AVX2 instead of SSE2,
          measured at five to ten percent of about one percent of a core, with byte-identical
          output; what it costs is an illegal instruction on any CPU without AVX2. Both
          flavours encode identical bitstreams, and the pipeline asserts that on every release.
          \`macos-arm64\` is built for \`apple-m1\`, which every arm64 Mac satisfies;
          \`linux-aarch64\` is baseline ARMv8-A.

          ## Checking what you downloaded

          \`\`\`
          curl -sSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          \`build.rs\` does the same thing automatically for the archive it fetches, then
          hashes the extracted \`.a\`/\`.lib\` against the \`sha256(library)\` line in that
          archive's own MANIFEST. Both are corruption checks — SHA256SUMS is published on the
          same release as the files it covers — and both need no API call.

          \`sha256(library)\` is also the interesting one to compare *between* releases: the
          library is reproducible across runs and machines, unlike the .tar.gz wrapping it, so
          two releases of the same fdk-aac with the same flags list the same hash.

          ## Licensing

          The codec is under the **Fraunhofer FDK AAC Codec Library licence**, which is not
          OSI-approved and grants **no patent rights** — its own text says patent licences for
          AAC must be obtained separately. That obligation travels with these archives to
          whoever ships them. See LICENSE in the repository. (The Rust binding is MIT, and is
          a different thing from the codec it binds.)
          EOF
          gh release edit "$TAG" --notes-file notes.md

      # Last, and only now does the git tag come into existence.
      - name: Publish (removes the draft, creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
          echo "published ${{ needs.prepare.outputs.tag }}"
