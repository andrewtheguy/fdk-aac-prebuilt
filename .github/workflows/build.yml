name: Build fdk-aac

# Build every archive and test it. This workflow never publishes — releasing is release.yml,
# which calls this one and then does the publishing part. Two triggers instead of one, so
# that "does it build and pass" can be asked at any time without anybody being committed to
# a release by asking.
#
# `workflow_dispatch` is the test loop, and Windows is why it matters: it is the one target
# that cannot be built or tested anywhere else here — Docker covers Linux
# (`./test-docker.sh`) and a Mac covers itself — so `targets: windows` is how the MSVC
# archive gets exercised at all.
#
# `workflow_call` is release.yml. A failure anywhere in here — a build, a test, the e2e
# binary, `check-static.sh`, the cross-target digest comparison — fails the caller's job and
# the release never happens.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "which targets to build and test"
        type: choice
        default: all
        options: [all, windows, x86_64, arm64]
  workflow_call:
    inputs:
      targets:
        description: "which targets to build and test"
        type: string
        default: all

# Read-only. The token that can create a release belongs to the job that creates one, and
# that job is in the other file.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      # That the committed headers are the pinned fdk-aac's, that src/bindings.rs is what
      # those headers say, and that src/version.rs is what the pinned sources say. Cheap,
      # and it runs before four compilers do.
      #
      # bindgen is installed rather than assumed: `--check` regenerates, and it refuses to
      # run under a version other than the one the committed file was made with, because
      # bindgen's output is not stable across its own releases.
      - name: Install the pinned bindgen
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          cargo install bindgen-cli --version 0.72.1 --locked
      - run: ./sync-prebuilt.sh --check

      # The matrix, narrowed here as *data* rather than by a job-level `if`. Two reasons,
      # one hard and one practical: a job-level condition cannot reference `matrix` at all —
      # GitHub rejects the workflow outright — and filtering before the fan-out means a
      # `targets: windows` dispatch starts one runner instead of four.
      - id: matrix
        env:
          GROUP: ${{ inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"macos-arm64",         "runs-on":"macos-latest",    "group":"arm64"},
            {"target":"linux-x86_64",        "runs-on":"ubuntu-24.04",    "group":"x86_64"},
            {"target":"linux-aarch64",       "runs-on":"ubuntu-24.04-arm","group":"arm64"},
            {"target":"windows-x86_64-msvc", "runs-on":"windows-latest",  "group":"windows"}
          ]'
          targets="$(jq -c --arg g "$GROUP" '[.[] | select($g == "all" or .group == $g)]' <<<"$all")"
          echo "$targets" | jq -r '.[].target' | sed 's/^/  /'
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          # The count, so the comparison job can require exactly this many to report and can
          # skip itself when the matrix holds only one. Without it that job has no way to tell
          # "narrowed on purpose" from "three targets died", and it must fail the second.
          echo "count=$(jq 'length' <<<"$targets")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      # No fail-fast: one target failing to configure is exactly the case where the other
      # three logs are the useful comparison.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # bash on the Windows runner too, so one script covers every target. cmake is
      # preinstalled on all three images.
      - name: Build ${{ matrix.target }}
        shell: bash
        run: ./build.sh ${{ matrix.target }}

      # The half of the artifact the archive alone does not cover: whether Rust can *link*
      # it. That is what has broken before — a CRT mismatch, a `.lib` under a name nobody
      # expected, an `.a` for the wrong ABI — and none of it shows up in a successful cmake
      # run. `--offline`, after sync-prebuilt.sh, also demonstrates the claim consumers care
      # about: once the archive exists, no build needs a network.
      - name: Link and test against it
        shell: bash
        run: |
          ./sync-prebuilt.sh
          cargo test --offline --workspace

      # The end-to-end leg: a release binary that is a *consumer* of the crate, executed on
      # the runner's own processor. It is the only place Windows gets exercised at all, since
      # neither Docker nor a Mac can do it. Note what it does not prove on x86_64: the
      # runners have AVX2, so a floor that leaked into the archive would run fine here and
      # SIGILL on an older machine — that is what build.sh's disassembly check is for.
      - name: End to end — encode and decode in a real binary
        shell: bash
        run: |
          cargo build --offline --release --workspace
          bin=target/release/fdk-aac-e2e
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin"
          ./check-static.sh "$bin"

      - name: Show what was built
        shell: bash
        run: cat dist/${{ matrix.target }}/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: fdk-aac-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

      # What the e2e binary measured, uploaded separately so the comparison job can collect
      # every target's without unpacking four archive trees: the bitstream digests, the
      # structural facts, and the decoded audio.
      - name: Collect what this target produced
        shell: bash
        run: cp digests.txt e2e-out/
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}
          path: e2e-out
          if-no-files-found: error

  # Do the targets agree — and at what strength?
  #
  # This replaces a `bit-exact` job that required all four to encode byte-identical
  # bitstreams. That assertion was false, and the first CI run on this repository disproved
  # it: the two arm64 targets matched each other exactly while linux-x86_64 differed on every
  # configuration. Not a miscompile. Each architecture replaces fdk-aac's generic fixed-point
  # routines with its own: on x86, `x86/fixmul_x86.h` and `x86/fixpoint_math_x86.h` supply an
  # `imul` and float-based `sqrtFixp`, `invSqrtNorm2`, `invFixp` and `schur_div`; on aarch64
  # — which `FDK_archdef.h` maps to `__arm__` plus `__ARM_ARCH_8__` — the `arm/` headers
  # supply A64 inline assembly for the multiplies, `cplxMultDiv2` and `clz`. The two sets
  # round differently from each other, so the encoder makes slightly different quantisation
  # decisions. Upstream ships it that way on purpose.
  #
  # It is not floating-point nondeterminism, the obvious suspect: the x86 routines are float,
  # but IEEE sqrt and division are correctly rounded, so MSVC and GCC agree to the byte, and
  # rebuilding linux-x86_64 with `-ffp-contract=off` — or at the baseline instead of
  # x86-64-v3 — changes not one digest.
  #
  # So the four are compared at the three strengths they actually agree at — structure
  # exactly, size within a tolerance, decoded audio as an SNR and a correlation, and digests
  # byte-for-byte but only between targets of the same architecture. compare-targets.py has
  # the measured numbers and the reasoning behind each floor.
  #
  # `if: always()` with an explicit expected count, rather than a `>= 2` guard: with fail-fast
  # off, a partial matrix would otherwise let the survivors "agree" among themselves. The
  # count comes from `plan`, so a narrowed dispatch skips this job instead of failing it —
  # which is what a single-target matrix has to do, having nothing to compare against.
  compare:
    needs: [plan, build]
    if: always() && fromJSON(needs.plan.outputs.count) >= 2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: e2e

      # The artifacts arrive as `e2e/e2e-<target>/`; the script wants one directory per target
      # named for it, so the prefix comes off here rather than being taught to the script.
      - name: Name each directory for its target
        run: |
          cd e2e
          for dir in e2e-*; do mv "$dir" "${dir#e2e-}"; done
          ls -1

      - name: The targets must agree
        run: python3 compare-targets.py e2e --expected ${{ needs.plan.outputs.count }}
